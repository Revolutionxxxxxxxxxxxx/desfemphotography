<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — DESFEM STUDIOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #000000;
            --white: #ffffff;
            --off-white: #f0f0f0;
            --gray: #888888;
            --dark-gray: #1a1a1a;
            --accent: #c8c8c8;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .bg-image {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background-image: url('gallery.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.25) saturate(0.7);
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.85) 100%);
        }

        .grain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1400px;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* 🎨 LOGO IMAGE STYLES */
        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .logo img {
            height: 50px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            transition: opacity 0.3s ease;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--white);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
        }

        .menu-toggle span {
            width: 24px;
            height: 2px;
            background: var(--white);
            transition: all 0.3s ease;
        }

        .menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        /* Gallery Hero */
        .gallery-hero {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 140px 50px 60px;
            text-align: center;
        }

        .gallery-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(50px, 10vw, 140px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -3px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .gallery-hero h1 .italic {
            font-style: italic;
            font-weight: 400;
        }

        .gallery-hero p {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gray);
            max-width: 600px;
            line-height: 1.8;
        }

        /* Filter Buttons */
        .filter-container {
            padding: 0 50px;
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-btn {
            padding: 12px 28px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--gray);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--white);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--white);
            color: var(--black);
            border-color: var(--white);
        }

        /* Gallery Grid */
        .gallery-section {
            padding: 0 50px 120px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            aspect-ratio: 1 / 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .gallery-item.hidden {
            display: none;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.6s ease;
            filter: grayscale(80%) contrast(1.1);
        }

        .gallery-item:hover img {
            transform: scale(1.08);
            filter: grayscale(0%) contrast(1);
        }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .gallery-item-overlay h3 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--white);
        }

        .gallery-item-overlay p {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gray);
        }

        .gallery-item-overlay .view-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 16px;
            transform: scale(0);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gallery-item:hover .view-icon {
            transform: scale(1);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 20px;
            color: var(--gray);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ============ LIGHTBOX ============ */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .lightbox-image-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-image-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: lightboxZoom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes lightboxZoom {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-info {
            text-align: center;
            color: var(--white);
        }

        .lightbox-info h3 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(22px, 3vw, 32px);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .lightbox-info p {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gray);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10001;
        }

        .lightbox-close:hover {
            background: var(--white);
            color: var(--black);
            transform: rotate(90deg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10001;
        }

        .lightbox-nav:hover {
            background: var(--white);
            color: var(--black);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev { left: 30px; }
        .lightbox-next { right: 30px; }

        .lightbox-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--gray);
        }

        /* Footer */
        footer {
            padding: 30px 50px;
            margin: 0 20px 20px;
            border-radius: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        footer p {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--gray);
            text-transform: uppercase;
        }

        .footer-links { display: flex; gap: 30px; }
        .footer-links a {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--gray);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .footer-links a:hover { color: var(--white); }

        /* Reveal Animation */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 1024px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            nav { padding: 14px 24px; top: 12px; width: calc(100% - 24px); }
            .logo img { height: 36px; }
            .menu-toggle { display: flex; }

            .nav-links {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.97);
                backdrop-filter: blur(30px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 32px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.4s ease;
                z-index: 999;
            }

            .nav-links.open { opacity: 1; pointer-events: all; }
            .nav-links a { font-size: 16px; letter-spacing: 3px; }

            .gallery-hero { padding: 120px 20px 40px; min-height: 40vh; }
            .gallery-hero h1 { font-size: clamp(40px, 12vw, 80px); }
            .gallery-hero p { font-size: 11px; letter-spacing: 3px; }

            .filter-container { padding: 0 20px; margin-bottom: 40px; gap: 8px; }
            .filter-btn { padding: 10px 20px; font-size: 10px; letter-spacing: 1.5px; }

            .gallery-section { padding: 0 20px 80px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

            .gallery-item-overlay { opacity: 1; padding: 16px; }
            .gallery-item-overlay h3 { font-size: 14px; }
            .gallery-item-overlay p { font-size: 9px; }
            .gallery-item-overlay .view-icon { display: none; }

            .lightbox-nav { width: 44px; height: 44px; font-size: 16px; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
            .lightbox-close { top: 15px; right: 15px; width: 44px; height: 44px; }

            footer { flex-direction: column; gap: 16px; text-align: center; padding: 24px 20px; border-radius: 24px; margin: 0 10px 10px; }
            .footer-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: 1fr; gap: 16px; }
            .gallery-item { aspect-ratio: 4 / 5; }
            .logo img { height: 32px; }
        }

        /* Touch devices */
        @media (hover: none) {
            .gallery-item img { filter: grayscale(0%) contrast(1); }
            .gallery-item-overlay { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="grain"></div>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Desfem Studios Logo">
        </a>
        <div class="menu-toggle" id="menuToggle">
            <span></span><span></span><span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#work">Work</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#services">Services</a></li>
            <li><a href="index.html#reviews">Reviews</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
        </ul>
    </nav>

    <!-- Gallery Hero -->
    <section class="gallery-hero">
        <h1 class="reveal">
            The <span class="italic">Gallery</span>
        </h1>
        <p class="reveal">A curated collection of moments, stories, and visual narratives — captured through our lens.</p>
    </section>

    <!-- Filter Buttons -->
    <div class="filter-container reveal" id="filterContainer">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Editorials">Editorials</button>
        <button class="filter-btn" data-filter="Portraits">Portraits</button>
        <button class="filter-btn" data-filter="Weddings">Weddings</button>
        <button class="filter-btn" data-filter="Corprates">Corprates</button>
        <button class="filter-btn" data-filter="Premium Visual Storytelling">Premium Visual Storytelling</button>
    </div>

    <!-- Gallery Grid -->
    <section class="gallery-section">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Loaded dynamically from Firebase -->
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next">
            <i class="fas fa-chevron-right"></i>
        </button>
        <div class="lightbox-content">
            <div class="lightbox-image-wrapper">
                <img id="lightboxImage" src="" alt="">
            </div>
            <div class="lightbox-info">
                <h3 id="lightboxTitle"></h3>
                <p id="lightboxMeta"></p>
            </div>
        </div>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Desfem Studios. All rights reserved.</p>
        <div class="footer-links">
            <a href="https://instagram.com/desfem_photography" target="_blank">Instagram</a>
            <a href="#">Behance</a>
            <a href="#">Vimeo</a>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Mobile Menu
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('open');
        });

        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('open');
            });
        });

        // Reveal on scroll
        const reveals = document.querySelectorAll('.reveal');
        const revealOnScroll = () => {
            reveals.forEach(el => {
                const windowHeight = window.innerHeight;
                const elementTop = el.getBoundingClientRect().top;
                if (elementTop < windowHeight - 80) el.classList.add('active');
            });
        };
        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);

        // ============ GALLERY DATA ============
        let galleryItems = [];
        let currentFilter = 'all';
        let currentIndex = 0;
        let filteredItems = [];

        // Load gallery from Firebase
        function loadGallery() {
            const grid = document.getElementById('galleryGrid');
            db.collection('portfolio').onSnapshot(snapshot => {
                grid.innerHTML = '';
                galleryItems = [];

                if (snapshot.empty) {
                    grid.innerHTML = '<p class="empty-state">No photos yet — check back soon</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const item = doc.data();
                    if (!item.imageUrl) return;
                    galleryItems.push({
                        id: doc.id,
                        title: item.title || '',
                        category: item.category || '',
                        year: item.year || '',
                        imageUrl: item.imageUrl
                    });
                });

                applyFilter();
            }, error => {
                console.error('Gallery load error:', error);
                grid.innerHTML = '<p class="empty-state">Unable to load gallery</p>';
            });
        }

        // Apply filter
        function applyFilter() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            filteredItems = currentFilter === 'all'
                ? galleryItems
                : galleryItems.filter(item => item.category === currentFilter);

            if (filteredItems.length === 0) {
                grid.innerHTML = '<p class="empty-state">No photos in this category</p>';
                return;
            }

            filteredItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item reveal active';
                div.dataset.index = index;
                div.innerHTML = `
                    <img src="${item.imageUrl}" alt="${item.title}" loading="lazy">
                    <div class="gallery-item-overlay">
                        <div class="view-icon"><i class="fas fa-expand"></i></div>
                        <h3>${item.title}</h3>
                        <p>${item.category} — ${item.year}</p>
                    </div>
                `;
                div.addEventListener('click', () => openLightbox(index));
                grid.appendChild(div);
            });
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilter();
            });
        });

        // ============ LIGHTBOX ============
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxMeta = document.getElementById('lightboxMeta');
        const lightboxCounter = document.getElementById('lightboxCounter');

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const item = filteredItems[currentIndex];
            if (!item) return;

            lightboxImage.src = item.imageUrl;
            lightboxImage.alt = item.title;
            lightboxTitle.textContent = item.title;
            lightboxMeta.textContent = `${item.category} — ${item.year}`;
            lightboxCounter.textContent = `${currentIndex + 1} / ${filteredItems.length}`;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % filteredItems.length;
            updateLightbox();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
            updateLightbox();
        }

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxNext').addEventListener('click', nextImage);
        document.getElementById('lightboxPrev').addEventListener('click', prevImage);

        // Click outside image to close
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        // Touch swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeDistance = touchEndX - touchStartX;
            if (Math.abs(swipeDistance) > 50) {
                if (swipeDistance > 0) prevImage();
                else nextImage();
            }
        }, { passive: true });

        // Start loading
        loadGallery();
    </script>
</body>
</html>
