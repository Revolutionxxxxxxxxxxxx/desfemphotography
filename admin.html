<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desfem Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #2a2a2a;
            --text: #ffffff;
            --muted: #888888;
            --accent: #ffffff;
            --danger: #ff4444;
            --success: #00cc66;
            --gold: #FFD700;
            --video-red: #ff3b30;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-box h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .login-box h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea { resize: vertical; min-height: 100px; }

        /* Featured Checkbox */
        .featured-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .featured-toggle:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .featured-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .featured-toggle .toggle-label {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .featured-toggle .toggle-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .featured-toggle .toggle-desc {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .featured-toggle .star-icon {
            font-size: 20px;
            color: var(--gold);
        }

        /* Media Type Toggle */
        .media-type-toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .media-type-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .media-type-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .media-type-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .media-type-btn.video-btn.active {
            background: var(--video-red);
            border-color: var(--video-red);
            color: var(--white);
        }

        .media-type-btn i {
            font-size: 16px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            width: 100%;
        }

        .btn-primary:hover { opacity: 0.85; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 16px;
            font-size: 11px;
        }

        .btn-danger:hover { background: var(--danger); color: white; }

        .btn-star {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-star:hover {
            color: var(--gold);
            border-color: var(--gold);
        }

        .btn-star.featured {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 11px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .admin-dashboard { display: none; }
        .admin-dashboard.active { display: block; }

        .admin-header {
            padding: 20px 40px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .admin-header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab {
            padding: 14px 24px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .panel h3 {
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .upload-btn-cloudinary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 40px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .upload-btn-cloudinary:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-btn-cloudinary.video-mode {
            border-color: rgba(255, 59, 48, 0.3);
        }

        .upload-btn-cloudinary.video-mode:hover {
            border-color: var(--video-red);
            background: rgba(255, 59, 48, 0.05);
        }

        .upload-btn-cloudinary i {
            font-size: 28px;
            color: var(--muted);
        }

        .upload-btn-cloudinary.video-mode i {
            color: var(--video-red);
        }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .preview-video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            background: #000;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .items-list {
            display: grid;
            gap: 16px;
            margin-top: 24px;
        }

        .item-row {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .item-row.featured-item {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.03);
        }

        .item-row img,
        .item-row video {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
        }

        .item-info h4 { font-size: 15px; margin-bottom: 4px; }
        .item-info p { font-size: 12px; color: var(--muted); }

        .featured-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: rgba(255, 215, 0, 0.15);
            color: var(--gold);
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .type-badge.video {
            background: rgba(255, 59, 48, 0.15);
            color: var(--video-red);
        }

        .type-badge.photo {
            background: rgba(0, 204, 102, 0.15);
            color: var(--success);
        }

        .item-actions { display: flex; gap: 8px; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 9999;
            max-width: 400px;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .admin-header { padding: 16px 20px; flex-direction: column; gap: 12px; }
            .admin-container { padding: 20px; }
            .panel { padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .item-row { grid-template-columns: 60px 1fr; }
            .item-row img, .item-row video { width: 60px; height: 60px; }
            .item-actions { grid-column: 1 / -1; justify-content: flex-end; }
            .tabs { gap: 4px; }
            .tab { padding: 12px 16px; font-size: 11px; }
            .media-type-toggle { flex-direction: column; }
            .media-type-btn { padding: 12px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>Desfem Studios</h1>
            <h2>Admin Portal</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="admin@desfem.studio">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" id="loginBtn">Sign In</button>
            <p class="error-msg" id="loginError"></p>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div class="admin-dashboard" id="adminDashboard">
        <div class="admin-header">
            <h1>Admin Portal</h1>
            <div class="user-info">
                <span id="currentUserEmail"></span>
                <button class="btn btn-secondary" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="admin-container">
            <div class="tabs">
                <button class="tab active" data-tab="portfolio">Portfolio</button>
                <button class="tab" data-tab="reviews">Reviews</button>
            </div>

            <!-- PORTFOLIO TAB -->
            <div class="tab-content active" id="portfolioTab">
                <div class="panel">
                    <h3>Add New Media</h3>

                    <!-- Media Type Toggle -->
                    <div class="media-type-toggle">
                        <button type="button" class="media-type-btn active" id="photoTypeBtn">
                            <i class="fas fa-image"></i> Photo
                        </button>
                        <button type="button" class="media-type-btn video-btn" id="videoTypeBtn">
                            <i class="fas fa-video"></i> Video
                        </button>
                    </div>

                    <button class="upload-btn-cloudinary" id="cloudinaryUploadBtn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="uploadBtnText">Click to Upload Photo</span>
                    </button>

                    <img class="preview-img" id="previewImg" alt="Preview">
                    <video class="preview-video" id="previewVideo" controls></video>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="photoTitle" placeholder="Shadow & Light">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="photoCategory">
                                <option value="Editorials">Editorials</option>
                                <option value="Portraits">Portraits</option>
                                <option value="Weddings">Weddings</option>
                                <option value="Corporates">Corporates</option>
                                <option value="Premium Visual Storytelling">Premium Visual Storytelling</option>
                                <option value="Fashion">Fashion</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Architecture">Architecture</option>
                                <option value="Still Life">Still Life</option>
                                <option value="Landscape">Landscape</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Year</label>
                            <input type="text" id="photoYear" placeholder="2026">
                        </div>
                        <div class="form-group">
                            <label>Order (display position)</label>
                            <input type="number" id="photoOrder" placeholder="1" value="1">
                        </div>
                    </div>

                    <!-- ⭐ FEATURED TOGGLE -->
                    <label class="featured-toggle" for="featuredCheck">
                        <input type="checkbox" id="featuredCheck">
                        <div class="toggle-label">
                            <span class="toggle-title">⭐ Feature on Homepage</span>
                            <span class="toggle-desc">Show this in the "Selected Works" section on the main page</span>
                        </div>
                        <i class="fas fa-star star-icon"></i>
                    </label>

                    <button class="btn btn-primary" id="publishBtn" disabled>Publish to Site</button>
                </div>

                <div class="panel">
                    <h3>Current Portfolio</h3>
                    <p style="color:var(--muted); font-size:12px; margin-bottom:16px;">
                        Click ⭐ to feature on homepage. Videos show in 16:9 format.
                    </p>
                    <div class="items-list" id="portfolioList"></div>
                </div>
            </div>

            <!-- REVIEWS TAB -->
            <div class="tab-content" id="reviewsTab">
                <div class="panel">
                    <h3>Add New Review</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Client Name</label>
                            <input type="text" id="reviewName" placeholder="Sarah Mitchell">
                        </div>
                        <div class="form-group">
                            <label>Role / Company</label>
                            <input type="text" id="reviewRole" placeholder="Creative Director, Vogue">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Review Text</label>
                        <textarea id="reviewText" placeholder="Write the client's review..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Stars (1-5)</label>
                            <input type="number" id="reviewStars" min="1" max="5" value="5">
                        </div>
                        <div class="form-group">
                            <label>Order</label>
                            <input type="number" id="reviewOrder" value="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Client Avatar URL (optional)</label>
                        <input type="text" id="reviewAvatar" placeholder="https://...">
                    </div>
                    <button class="btn btn-primary" id="addReviewBtn">Add Review</button>
                </div>

                <div class="panel">
                    <h3>Current Reviews</h3>
                    <div class="items-list" id="reviewsList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // ============================================
        // ⚙️ CLOUDINARY CONFIGURATION
        // ============================================
        const CLOUDINARY_CONFIG = {
            cloudName: 'dcdxmcv5x',
            uploadPreset: 'desfem_uploads'
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============ AUTH ============
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('adminDashboard');

        auth.onAuthStateChanged(user => {
            if (user) {
                loginScreen.style.display = 'none';
                dashboard.classList.add('active');
                document.getElementById('currentUserEmail').textContent = user.email;
                loadPortfolioList();
                loadReviewsList();
            } else {
                loginScreen.style.display = 'flex';
                dashboard.classList.remove('active');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';
            try {
                await auth.signInWithEmailAndPassword(email, password);
                showToast('Welcome back!', 'success');
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });

        document.getElementById('loginPassword').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

        // ============ TABS ============
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
            });
        });

        // ============ TOAST ============
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================
        // MEDIA TYPE TOGGLE (Photo/Video)
        // ============================================
        let currentMediaType = 'photo';
        const photoTypeBtn = document.getElementById('photoTypeBtn');
        const videoTypeBtn = document.getElementById('videoTypeBtn');
        const uploadBtnText = document.getElementById('uploadBtnText');
        const uploadBtn = document.getElementById('cloudinaryUploadBtn');
        const previewImg = document.getElementById('previewImg');
        const previewVideo = document.getElementById('previewVideo');

        photoTypeBtn.addEventListener('click', () => {
            currentMediaType = 'photo';
            photoTypeBtn.classList.add('active');
            videoTypeBtn.classList.remove('active');
            uploadBtnText.textContent = 'Click to Upload Photo';
            uploadBtn.classList.remove('video-mode');
            uploadBtn.querySelector('i').className = 'fas fa-cloud-upload-alt';
            previewImg.style.display = 'block';
            previewVideo.style.display = 'none';
            previewVideo.pause();
        });

        videoTypeBtn.addEventListener('click', () => {
            currentMediaType = 'video';
            videoTypeBtn.classList.add('active');
            photoTypeBtn.classList.remove('active');
            uploadBtnText.textContent = 'Click to Upload Video';
            uploadBtn.classList.add('video-mode');
            uploadBtn.querySelector('i').className = 'fas fa-film';
            previewImg.style.display = 'none';
            previewVideo.style.display = 'block';
        });

        // ============================================
        // CLOUDINARY UPLOAD (Photo + Video)
        // ============================================
        let uploadedMediaUrl = null;
        const publishBtn = document.getElementById('publishBtn');

        uploadBtn.addEventListener('click', () => {
            if (CLOUDINARY_CONFIG.cloudName === 'YOUR_CLOUD_NAME') {
                showToast('Please configure Cloudinary first!', 'error');
                return;
            }

            const isVideo = currentMediaType === 'video';

            const widget = cloudinary.createUploadWidget({
                cloudName: CLOUDINARY_CONFIG.cloudName,
                uploadPreset: CLOUDINARY_CONFIG.uploadPreset,
                sources: ['local', 'camera', 'url'],
                multiple: false,
                maxFileSize: isVideo ? 100000000 : 10000000,
                resourceType: isVideo ? 'video' : 'image',
                cropping: false,
                clientAllowedFormats: isVideo ? ['mp4', 'mov', 'webm'] : ['jpg', 'png', 'webp', 'jpeg'],
                styles: {
                    palette: {
                        window: "#141414",
                        windowBorder: "#2a2a2a",
                        tabIcon: "#ffffff",
                        menuIcons: "#888888",
                        textDark: "#ffffff",
                        textLight: "#888888",
                        link: "#ffffff",
                        action: "#ffffff",
                        inactiveTabIcon: "#888888",
                        error: "#ff4444",
                        inProgress: "#ffffff",
                        complete: "#00cc66",
                        sourceBg: "#0a0a0a"
                    }
                }
            }, (error, result) => {
                if (!error && result && result.event === 'success') {
                    uploadedMediaUrl = result.info.secure_url;

                    if (isVideo) {
                        previewVideo.src = uploadedMediaUrl;
                        previewVideo.style.display = 'block';
                        previewImg.style.display = 'none';
                    } else {
                        previewImg.src = uploadedMediaUrl;
                        previewImg.style.display = 'block';
                        previewVideo.style.display = 'none';
                    }

                    publishBtn.disabled = false;
                    showToast(isVideo ? '🎬 Video uploaded! Fill in details and publish.' : '📸 Image uploaded! Fill in details and publish.', 'success');
                    console.log('Media URL:', uploadedMediaUrl);
                } else if (error) {
                    console.error('Cloudinary error:', error);
                    showToast('Upload failed: ' + (error.message || 'Unknown error'), 'error');
                }
            });

            widget.open();
        });

        // ============================================
        // PUBLISH TO FIREBASE
        // ============================================
        publishBtn.addEventListener('click', async () => {
            if (!uploadedMediaUrl) {
                showToast('Please upload media first', 'error');
                return;
            }

            const title = document.getElementById('photoTitle').value.trim();
            const category = document.getElementById('photoCategory').value;
            const year = document.getElementById('photoYear').value.trim();
            const order = parseInt(document.getElementById('photoOrder').value) || 1;
            const featured = document.getElementById('featuredCheck').checked;

            if (!title || !year) {
                showToast('Please fill in title and year', 'error');
                return;
            }

            publishBtn.disabled = true;
            publishBtn.innerHTML = '<span class="loading"></span> Publishing...';

            try {
                await db.collection('portfolio').add({
                    title,
                    category,
                    year,
                    order,
                    featured,
                    type: currentMediaType,
                    imageUrl: uploadedMediaUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                const typeLabel = currentMediaType === 'video' ? 'Video' : 'Photo';
                const msg = featured
                    ? `${typeLabel} published & featured on homepage!`
                    : `${typeLabel} published to gallery!`;
                showToast(msg, 'success');

                // Reset form
                uploadedMediaUrl = null;
                previewImg.style.display = 'none';
                previewImg.src = '';
                previewVideo.style.display = 'none';
                previewVideo.src = '';
                previewVideo.pause();
                document.getElementById('photoTitle').value = '';
                document.getElementById('photoYear').value = '';
                document.getElementById('photoOrder').value = '1';
                document.getElementById('featuredCheck').checked = false;
                publishBtn.disabled = true;
            } catch (err) {
                console.error(err);
                showToast('Publish failed: ' + err.message, 'error');
            } finally {
                publishBtn.disabled = false;
                publishBtn.innerHTML = 'Publish to Site';
            }
        });

        // ============================================
        // LOAD PORTFOLIO LIST
        // ============================================
        function loadPortfolioList() {
            const list = document.getElementById('portfolioList');
            db.collection('portfolio').onSnapshot(snapshot => {
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p style="color:var(--muted)">No media yet. Upload your first one above.</p>';
                    return;
                }
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const isFeatured = d.featured === true;
                    const isVideo = d.type === 'video';
                    const row = document.createElement('div');
                    row.className = 'item-row' + (isFeatured ? ' featured-item' : '');

                    const mediaHTML = isVideo
                        ? `<video src="${d.imageUrl}" muted preload="metadata"></video>`
                        : `<img src="${d.imageUrl}" alt="${d.title}">`;

                    const typeBadge = isVideo
                        ? '<span class="type-badge video"><i class="fas fa-video"></i> Video</span>'
                        : '<span class="type-badge photo"><i class="fas fa-image"></i> Photo</span>';

                    const featuredBadge = isFeatured
                        ? '<span class="featured-badge"><i class="fas fa-star"></i> Featured</span>'
                        : '';

                    row.innerHTML = `
                        ${mediaHTML}
                        <div class="item-info">
                            <h4>
                                ${d.title}
                                ${typeBadge}
                                ${featuredBadge}
                            </h4>
                            <p>${d.category} • ${d.year} • Order: ${d.order}</p>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-star ${isFeatured ? 'featured' : ''}"
                                    onclick="toggleFeatured('${doc.id}', ${!isFeatured})"
                                    title="${isFeatured ? 'Remove from homepage' : 'Feature on homepage'}">
                                <i class="fas fa-star"></i>
                            </button>
                            <button class="btn btn-danger" onclick="deletePortfolio('${doc.id}')">Delete</button>
                        </div>
                    `;
                    list.appendChild(row);
                });
            });
        }

        // ============================================
        // TOGGLE FEATURED STATUS
        // ============================================
        window.toggleFeatured = async (id, featured) => {
            try {
                await db.collection('portfolio').doc(id).update({ featured: featured });
                showToast(featured ? '⭐ Featured on homepage!' : 'Removed from homepage', 'success');
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
            }
        };

        window.deletePortfolio = async (id) => {
            if (!confirm('Delete this media?')) return;
            try {
                await db.collection('portfolio').doc(id).delete();
                showToast('Media deleted', 'success');
            } catch (err) {
                showToast('Delete failed: ' + err.message, 'error');
            }
        };

        // ============================================
        // REVIEWS
        // ============================================
        document.getElementById('addReviewBtn').addEventListener('click', async () => {
            const name = document.getElementById('reviewName').value.trim();
            const role = document.getElementById('reviewRole').value.trim();
            const text = document.getElementById('reviewText').value.trim();
            const stars = parseInt(document.getElementById('reviewStars').value) || 5;
            const order = parseInt(document.getElementById('reviewOrder').value) || 1;
            const avatarUrl = document.getElementById('reviewAvatar').value.trim();

            if (!name || !text) {
                showToast('Please fill in name and review text', 'error');
                return;
            }

            const btn = document.getElementById('addReviewBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Saving...';

            try {
                await db.collection('reviews').add({
                    name, role, text, stars, order, avatarUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('Review added!', 'success');
                document.getElementById('reviewName').value = '';
                document.getElementById('reviewRole').value = '';
                document.getElementById('reviewText').value = '';
                document.getElementById('reviewAvatar').value = '';
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Add Review';
            }
        });

        function loadReviewsList() {
            const list = document.getElementById('reviewsList');
            db.collection('reviews').onSnapshot(snapshot => {
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p style="color:var(--muted)">No reviews yet.</p>';
                    return;
                }
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <img src="${d.avatarUrl || 'https://via.placeholder.com/80'}" alt="${d.name}">
                        <div class="item-info">
                            <h4>${d.name}</h4>
                            <p>${d.role} • ${'★'.repeat(d.stars || 5)}</p>
                            <p style="margin-top:4px;font-style:italic;">"${d.text.substring(0, 80)}${d.text.length > 80 ? '...' : ''}"</p>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-danger" onclick="deleteReview('${doc.id}')">Delete</button>
                        </div>
                    `;
                    list.appendChild(row);
                });
            });
        }

        window.deleteReview = async (id) => {
            if (!confirm('Delete this review?')) return;
            try {
                await db.collection('reviews').doc(id).delete();
                showToast('Review deleted', 'success');
            } catch (err) {
                showToast('Delete failed: ' + err.message, 'error');
            }
        };
    </script>
</body>
</html>
